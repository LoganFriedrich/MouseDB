# Conda environment for Connectome Data Entry
#
# Create with:
#   conda env create -f environment.yml -p "Y:/LAB_ROOT/envs/connectome_data"
#
# Activate with:
#   conda activate "Y:/LAB_ROOT/envs/connectome_data"

name: connectome_data
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pip
  - pandas>=1.5
  - openpyxl>=3.0
  - pyarrow>=10.0
  - sqlalchemy>=2.0
  - pyqt>=5.15
  - pip:
    - -e "Y:/LAB_ROOT/Behavior/connectome_data"
