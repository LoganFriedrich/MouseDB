# Conda environment for MouseDB
#
# Create with (from the repo root; <env_dir> = wherever you keep environments):
#   conda env create -f environment.yml -p <env_dir>
#
# Activate with:
#   conda activate <env_dir>

name: MouseDB
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pip
  - pandas>=1.5
  - openpyxl>=3.0
  - pyarrow>=10.0
  - sqlalchemy>=2.0
  - pyqt>=5.15
  - pip:
    - -e .   # this repo, editable (run `conda env create` from the repo root)
