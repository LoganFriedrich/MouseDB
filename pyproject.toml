[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mousedb"
version = "0.1.0"
description = "Database and data management tools for mouse experiments"
readme = "README.md"
authors = [
    {name = "Logan Friedrich"}
]
license = {text = "MIT"}
# Bumped from 3.9 to 3.10: 3.9 went EOL October 2025 and the
# endpoint_ck_analysis sibling subpackage already requires 3.10. Keeping the
# two pyproject files in sync prevents env mismatches.
requires-python = ">=3.10"
dependencies = [
    "sqlalchemy>=2.0",
    "pandas>=1.5",
    "openpyxl>=3.0",
    "pyarrow>=10.0",
    "matplotlib>=3.5",
    "scipy>=1.9",
    "PyQt5>=5.15",
    "qtpy>=2.0",
]

[project.optional-dependencies]
web = [
    "fastapi>=0.100",
    "uvicorn[standard]>=0.20",
    "jinja2>=3.0",
    "python-multipart>=0.0.5",
    "h5py>=3.0",
    "tables>=3.7",
    "plotly>=5.0",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",          # coverage reporting; opt-in via --cov flag
    "nbclient>=0.8",            # required by endpoint_ck_analysis smoke test that executes notebooks
    "nbformat>=5.7",            # parses .ipynb files in the smoke test
    "papermill>=2.4",           # parameterized notebook execution; useful for CI / reproducible runs
    "black",
    "ruff",
]

[project.scripts]
mousedb = "mousedb.cli:main"
mousedb-status = "mousedb.cli:mousedb_status"
mousedb-init = "mousedb.cli:mousedb_init"
mousedb-new-cohort = "mousedb.cli:mousedb_new_cohort"
mousedb-import = "mousedb.cli:mousedb_import"
mousedb-export = "mousedb.cli:mousedb_export"
mousedb-entry = "mousedb.cli:mousedb_entry"
mousedb-browse = "mousedb.cli:mousedb_browse"
mousedb-check = "mousedb.cli:mousedb_check"
mousedb-make-sheets = "mousedb.cohort_tools.make_sheets:main"
mousedb-update-sheets = "mousedb.cohort_tools.update_sheets:main"
mousedb-reorganize = "mousedb.utils.reorganize:main"
mousedb-quick-export = "mousedb.exporters.quick_export:main"
mousedb-video-status = "mousedb.cli:mousedb_video_status"
mousedb-archive-status = "mousedb.cli:mousedb_archive_status"
mousedb-web = "mousedb.web.main:run_server"
mousedb-refresh-snapshot = "mousedb.exporters.refresh_snapshot:main"

[tool.setuptools.packages.find]
where = ["."]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
select = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
# Pin the test discovery roots so `pytest` from the repo root only collects
# real test suites. Without this, pytest's auto-discovery would scan into
# .venv/, build artifacts, and any stray script whose name happens to start
# with `test_` (the historical landmine: a `test_setup.py` script with
# interactive `input()` calls used to hang pytest).
testpaths = [
    "tests",
    "mousedb/endpoint_ck_analysis/tests",
]
# Make collection failures hard rather than silent so a typo in a test file
# stops the suite instead of silently dropping coverage.
addopts = "--strict-markers -ra"
# Ignore vendored/build directories that occasionally appear in the tree.
norecursedirs = [
    ".git",
    ".venv",
    "*.egg-info",
    "build",
    "dist",
    "pytest-cache-files-*",
    "mousedb/endpoint_ck_analysis/.venv",
    "mousedb/endpoint_ck_analysis/_bundled_data",
]

[tool.coverage.run]
source = ["mousedb"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "mousedb/endpoint_ck_analysis/_bundled_data/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
