name: tests

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  # Allow manual runs from the Actions tab.
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package with dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run pytest
        # The endpoint_ck_analysis smoke test exercises nbclient and needs
        # the bundled connectome.db. CI doesn't ship the DB, so we exclude
        # the smoke test directory here; it runs locally as part of the
        # standard `pytest` invocation against a populated DB.
        run: |
          pytest tests/ -v
